<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRMail.shop - Painel de E-mails</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #080c10; --surface: #0d1117; --border: #1c2333; --accent: #00f0ff; --accent2: #00ff88; --text: #cdd9e5; --muted: #768390; --danger: #ff4d4f; --card: #111820; --inbox-width: 320px; }
  body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 60px; background: rgba(8,12,16,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 28px; height: 28px; background: var(--accent); color: #080c10; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #hero { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px 60px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 100px; padding: 5px 14px; font-size: 11px; color: var(--accent); margin-bottom: 28px; text-transform: uppercase; }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(36px, 6vw, 72px); font-weight: 800; line-height: 1.05; letter-spacing: -2px; color: #fff; margin-bottom: 18px; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 14px; color: var(--muted); max-width: 440px; line-height: 1.7; margin-bottom: 48px; }
  #setup-card { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; max-width: 560px; margin: 0 auto; box-shadow: 0 0 60px rgba(0, 240, 255, 0.04); }
  .card-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; }
  .domain-suffix { display: flex; align-items: center; padding: 0 14px; background: rgba(0, 240, 255, 0.06); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 8px; font-size: 13px; color: var(--accent); white-space: nowrap; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--accent); color: #080c10; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
  .btn:hover { background: #4dffff; transform: translateY(-1px); }
  .btn-sm { padding: 8px 16px; font-size: 12px; width: auto; margin-top: 0; }
  .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn-outline:hover { background: rgba(0, 240, 255, 0.08); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: rgba(255,77,79,0.08); }
  #app { display: none; position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px; gap: 20px; }
  #app.show { display: flex; flex-direction: column; }
  .top-bar { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .email-display { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .email-badge { background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 8px; padding: 8px 14px; font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .email-badge:hover { background: rgba(0, 240, 255, 0.15); }
  .mail-layout { display: grid; grid-template-columns: var(--inbox-width) 1fr; gap: 16px; min-height: 500px; }
  .inbox-panel, .email-view, .extra-emails { background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: #fff; }
  .count-badge { background: var(--accent); color: #080c10; border-radius: 100px; padding: 1px 7px; font-size: 10px; font-weight: 700; margin-left: 8px; }
  .mail-list { flex: 1; overflow-y: auto; }
  .mail-item { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .mail-item:hover { background: rgba(0, 240, 255, 0.04); }
  .mail-item.active { background: rgba(0, 240, 255, 0.08); border-left: 2px solid var(--accent); }
  .mail-from { font-size: 12px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .mail-subject { font-size: 11px; color: var(--text); margin-bottom: 4px; }
  .empty-inbox, .no-email-selected { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 12px; padding: 40px; }
  .empty-icon, .no-email-icon { font-size: 40px; opacity: 0.3; }
  .email-view-header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .email-subject-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 12px; }
  .email-meta { display: flex; gap: 16px; font-size: 11px; color: var(--muted); }
  .email-body { padding: 24px; overflow-y: auto; font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
  .email-code-block { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 16px 20px; margin: 16px 0; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: 8px; text-align: center; }
  #toast { position: fixed; bottom: 32px; right: 32px; background: var(--card); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 20px; font-size: 12px; color: var(--accent); z-index: 9999; transform: translateY(80px); opacity: 0; transition: 0.3s; }
  #toast.show { transform: translateY(0); opacity: 1; }
  .extra-emails { padding: 20px 24px; gap: 16px; margin-top: 20px; }
  .aliases-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .alias-chip { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 11px; cursor: pointer; }
  .refresh-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 11px; }
  .refresh-btn:hover { color: var(--accent); }
  .spinning { animation: spin 0.7s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav>
  <div class="logo"><div class="logo-icon">✉</div>BRMail</div>
  <div class="status-dot"><div class="dot"></div>SERVIDOR ONLINE</div>
</nav>

<div id="hero-section">
  <div id="hero">
    <div class="badge">✦ Serviço de e-mail temporário</div>
    <h1>Seu e-mail<br><span>sob controle</span></h1>
  </div>
  <div id="setup-card">
    <div class="card-label">// Configuração inicial</div>
    <div class="input-group">
      <label>CRIE SEU PRIMEIRO ENDEREÇO</label>
      <div class="input-row">
        <input type="text" id="alias-input" placeholder="meu-codigo" maxlength="30" />
        <div class="domain-suffix">@brmail.shop</div>
      </div>
    </div>
    <button class="btn" onclick="startApp()">⚡ Acessar Caixa de Entrada</button>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <div class="email-display">
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1px">ENDEREÇO ATIVO</div>
        <div id="active-alias-display" class="email-badge" onclick="copyEmail()">
          <span id="active-alias-text"></span> <span>⎘</span>
        </div>
      </div>
    </div>
    <div>
      <button class="btn btn-danger btn-sm" onclick="resetApp()">✕ Sair</button>
    </div>
  </div>

  <div class="mail-layout">
    <div class="inbox-panel">
      <div class="panel-header">
        <div class="panel-title">📬 Caixa de entrada <span class="count-badge" id="mail-count">0</span></div>
        <button class="refresh-btn" id="refresh-btn" onclick="fetchRealEmails(true)">⟳ atualizar</button>
      </div>
      <div class="mail-list" id="mail-list">
        <div class="empty-inbox" id="empty-state">
          <div class="empty-icon">📭</div>
          <div>Aguardando códigos chegarem...</div>
        </div>
      </div>
    </div>

    <div class="email-view" id="email-view">
      <div class="no-email-selected" id="no-selection">
        <div class="no-email-icon">✉</div>
        <div>Selecione um e-mail para ler o código</div>
      </div>
    </div>
  </div>

  <div class="extra-emails">
    <div class="panel-title">🔗 E-mails adicionais</div>
    <div class="aliases-grid" id="aliases-grid"></div>
    <div class="input-row">
      <input type="text" id="new-alias-input" placeholder="novo-email" maxlength="30" />
      <div class="domain-suffix">@brmail.shop</div>
      <button class="btn btn-outline btn-sm" onclick="addAlias()">+ Adicionar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  
  const WORKER_URL = 'https://recebedor-brmail.klevi8129.workers.dev/';
  const DOMAIN = '@brmail.shop';
  
  let state = {
    activeAlias: '',
    aliases: [],
    emails: [],
    selectedEmail: null,
  };

  try {
    const saved = localStorage.getItem('brmail_state');
    if (saved) {
      state = JSON.parse(saved);
      if (state.activeAlias) renderApp();
    }
  } catch(e) {}

  function saveState() { localStorage.setItem('brmail_state', JSON.stringify(state)); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = '✓ ' + msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function startApp() {
    const al = document.getElementById('alias-input').value.trim() || 'teste';
    state.activeAlias = al.toLowerCase() + DOMAIN;
    state.aliases = []; state.emails = []; state.selectedEmail = null;
    saveState(); renderApp();
  }

  function renderApp() {
    document.getElementById('hero-section').style.display = 'none';
    document.getElementById('app').classList.add('show');
    document.getElementById('active-alias-text').textContent = state.activeAlias;
    renderAliases();
    fetchRealEmails(); 
  }

  function copyEmail() {
    navigator.clipboard.writeText(state.activeAlias).then(() => showToast('Copiado!'));
  }

  
  async function fetchRealEmails(manual = false) {
    if(manual) document.getElementById('refresh-btn').classList.add('spinning');
    
    try {
      const res = await fetch(WORKER_URL);
      const todosEmailsServidor = await res.json();
      
     
      const meusEnderecos = [state.activeAlias, ...state.aliases].map(a => a.toLowerCase());
      
      const meusEmails = todosEmailsServidor.filter(email => {
          if(!email.to) return false;
          return meusEnderecos.some(endereco => email.to.toLowerCase().includes(endereco));
      });

      if(meusEmails.length > state.emails.length && !manual) {
          showToast("Novo código recebido!");
      }

      state.emails = meusEmails;
      renderMailList();
    } catch (e) {
      console.log("Aguardando servidor...");
    }

    if(manual) {
        setTimeout(() => document.getElementById('refresh-btn').classList.remove('spinning'), 500);
        showToast("Caixa atualizada");
    }
  }

  // Atualiza a caixa de entrada automaticamente a cada 5 segundos
  setInterval(() => {
      if(document.getElementById('app').classList.contains('show')) {
          fetchRealEmails();
      }
  }, 5000);

  function renderMailList() {
    const list = document.getElementById('mail-list');
    document.getElementById('mail-count').textContent = state.emails.length;

    if (state.emails.length === 0) {
      list.innerHTML = ''; list.appendChild(document.getElementById('empty-state'));
      document.getElementById('empty-state').style.display = 'flex'; return;
    }

    list.innerHTML = '';
    state.emails.forEach(email => {
      const d = document.createElement('div');
      d.className = 'mail-item' + (state.selectedEmail === email.id ? ' active' : '');
      const t = new Date(email.time);
      d.innerHTML = `
        <div class="mail-from">${escHtml(email.from)}</div>
        <div class="mail-subject">${escHtml(email.subject)}</div>
        <div style="font-size:10px;color:var(--muted)">${t.toLocaleTimeString('pt-BR')} · para ${escHtml(email.to)}</div>
      `;
      d.onclick = () => selectEmail(email.id);
      list.appendChild(d);
    });
  }

  function selectEmail(id) {
    state.selectedEmail = id; renderMailList();
    const email = state.emails.find(e => e.id === id);
    const view = document.getElementById('email-view');
    view.innerHTML = `
      <div class="email-view-header">
        <div class="email-subject-title">${escHtml(email.subject)}</div>
        <div class="email-meta">
          <span>De: <strong style="color:var(--text)">${escHtml(email.from)}</strong></span>
          <span>Para: <strong style="color:var(--accent)">${escHtml(email.to)}</strong></span>
        </div>
      </div>
      <div class="email-body">
        ${escHtml(email.body)}
        <div class="email-code-block">${escHtml(email.code)}</div>
      </div>
    `;
  }

  function addAlias() {
    const val = document.getElementById('new-alias-input').value.trim();
    if (!val) return showToast('Digite um nome!');
    const full = val.toLowerCase() + DOMAIN;
    if (state.aliases.includes(full) || full === state.activeAlias) return showToast('Já existe!');
    state.aliases.push(full); saveState(); renderAliases(); fetchRealEmails();
  }

  function renderAliases() {
    const grid = document.getElementById('aliases-grid');
    grid.innerHTML = '';
    state.aliases.forEach(alias => {
      const chip = document.createElement('div'); chip.className = 'alias-chip';
      chip.innerHTML = `${escHtml(alias)} <span style="color:var(--danger);margin-left:5px" onclick="event.stopPropagation(); removeAlias('${alias}')">✕</span>`;
      chip.onclick = () => navigator.clipboard.writeText(alias).then(() => showToast('Copiado!'));
      grid.appendChild(chip);
    });
  }

  function removeAlias(alias) {
    state.aliases = state.aliases.filter(a => a !== alias);
    saveState(); renderAliases(); fetchRealEmails();
  }

  function resetApp() {
    state = { activeAlias:'', aliases:[], emails:[], selectedEmail:null };
    saveState(); location.reload();
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
