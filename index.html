<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRMail.shop - Seu E-mail Temporário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg-main:#FFFFFF; --bg-sub:#F9FAFB; --border:#E5E7EB; --text-main:#111827; --text-sub:#6B7280; --accent:#00f0ff; --accent-dark:#00c9d6; --error:#EF4444; --inbox-width:320px; }
  .dark-theme { --bg-main:#0A0F14; --bg-sub:#111820; --border:#1C2333; --text-main:#F3F4F6; --text-sub:#9CA3AF; }
  body { font-family:'Inter',sans-serif; background:var(--bg-main); color:var(--text-main); -webkit-font-smoothing:antialiased; transition:background 0.3s,color 0.3s; min-height:100vh; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:70px; background:var(--bg-main); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
  .logo { font-weight:700; font-size:20px; color:var(--text-main); display:flex; align-items:center; gap:8px; }
  .logo-icon { width:30px; height:30px; background:var(--accent); color:#000; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
  .nav-utility { display:flex; align-items:center; gap:16px; }
  .theme-toggle { background:transparent; border:1px solid var(--border); color:var(--text-main); font-size:13px; padding:6px 14px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:500; transition:0.2s; font-family:'Inter',sans-serif; }
  .theme-toggle:hover { background:var(--bg-sub); }
  .status-dot { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-sub); }
  .dot { width:7px; height:7px; border-radius:50%; background:#10B981; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #hero-section { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 70px); text-align:center; padding:40px 20px; }
  .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,240,255,0.08); border:1px solid rgba(0,240,255,0.2); border-radius:100px; padding:6px 16px; font-size:12px; font-weight:500; color:var(--accent-dark); margin-bottom:24px; }
  h1 { font-size:clamp(30px,5vw,52px); font-weight:800; line-height:1.1; letter-spacing:-1.5px; margin-bottom:16px; }
  h1 span { color:var(--accent-dark); }
  .subtitle { font-size:16px; color:var(--text-sub); max-width:500px; line-height:1.6; margin-bottom:40px; }
  #setup-card { background:var(--bg-main); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:440px; box-shadow:0 4px 24px rgba(0,0,0,0.06); }
  .dark-theme #setup-card { box-shadow:0 4px 24px rgba(0,0,0,0.3); }
  .card-label { font-size:11px; color:var(--text-sub); letter-spacing:1.5px; text-transform:uppercase; font-weight:600; margin-bottom:24px; }
  input { width:100%; background:var(--bg-sub); border:1px solid var(--border); border-radius:8px; padding:13px 16px; font-family:'Inter',sans-serif; font-size:14px; color:var(--text-main); outline:none; transition:0.15s; margin-bottom:12px; }
  input:focus { border-color:var(--accent-dark); box-shadow:0 0 0 3px rgba(0,240,255,0.12); background:var(--bg-main); }
  .btn { width:100%; padding:14px; border:none; border-radius:8px; background:var(--accent); color:#000; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer; transition:0.2s; margin-top:8px; }
  .btn:hover { background:var(--accent-dark); transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,240,255,0.3); }
  .btn:active { transform:translateY(0); }
  .btn-sm { padding:9px 18px; font-size:12px; width:auto; margin-top:0; }
  .btn-danger { background:transparent; color:var(--error); border:1px solid rgba(239,68,68,0.3); }
  .btn-danger:hover { background:rgba(239,68,68,0.08); box-shadow:none; transform:none; }
  #msg-erro { color:var(--error); font-size:13px; margin-top:12px; display:none; }
  #app { display:none; max-width:1200px; margin:32px auto; padding:0 24px; gap:20px; }
  #app.show { display:grid; grid-template-columns:var(--inbox-width) 1fr; align-items:start; }
  .top-bar-clean { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:12px; padding:16px 24px; background:var(--bg-main); }
  .email-badge { background:var(--bg-sub); border:1px solid var(--border); border-radius:8px; padding:10px 16px; font-size:14px; color:var(--accent-dark); display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500; transition:0.2s; }
  .email-badge:hover { border-color:var(--accent-dark); }
  .inbox-panel, .email-view { background:var(--bg-main); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; height:620px; }
  .panel-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--bg-sub); flex-shrink:0; }
  .panel-title { font-size:13px; font-weight:600; color:var(--text-main); display:flex; align-items:center; gap:8px; }
  .count-badge { background:var(--accent); color:#000; border-radius:100px; padding:1px 8px; font-size:11px; font-weight:700; }
  .mail-list { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .mail-item { padding:16px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.15s; }
  .mail-item:hover { background:rgba(0,240,255,0.03); }
  .mail-item.active { background:rgba(0,240,255,0.07); border-left:3px solid var(--accent); }
  .mail-from { font-size:13px; font-weight:600; color:var(--text-main); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mail-subject { font-size:12px; color:var(--text-sub); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mail-time { font-size:11px; color:var(--text-sub); opacity:.7; }
  .empty-inbox, .no-email-selected { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-sub); font-size:13px; padding:40px; text-align:center; }
  .email-view-header { padding:24px 28px; border-bottom:1px solid var(--border); background:var(--bg-main); flex-shrink:0; }
  .email-subject-title { font-size:18px; font-weight:700; color:var(--text-main); margin-bottom:14px; line-height:1.3; }
  .email-meta { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-sub); }
  .email-body { flex:1; background:var(--bg-sub); padding:24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }

  /* CÓDIGO */
  .code-box { background:var(--bg-main); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:20px; text-align:center; }
  .code-label { font-size:11px; color:var(--text-sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .code-number { font-size:36px; font-weight:800; color:var(--accent); letter-spacing:10px; font-family:monospace; }
  .copy-code-btn { margin-top:10px; display:inline-block; font-size:11px; color:var(--text-sub); cursor:pointer; background:var(--bg-sub); border:1px solid var(--border); border-radius:6px; padding:4px 12px; transition:0.2s; }
  .copy-code-btn:hover { color:var(--accent); border-color:var(--accent); }

  /* LINKS */
  .links-section { display:flex; flex-direction:column; gap:8px; }
  .links-label { font-size:11px; color:var(--text-sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .verify-link { display:flex; align-items:center; gap:10px; background:var(--bg-main); border:1px solid var(--border); border-radius:8px; padding:12px 16px; text-decoration:none; color:var(--accent-dark); font-size:12px; font-weight:500; transition:0.2s; overflow:hidden; }
  .verify-link:hover { border-color:var(--accent); background:rgba(0,240,255,0.04); }
  .verify-link span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

  .text-body { font-size:13px; line-height:1.8; color:var(--text-main); white-space:pre-wrap; word-break:break-word; background:var(--bg-main); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .divider { border:none; border-top:1px solid var(--border); }
  .refresh-btn { background:transparent; border:none; color:var(--text-sub); cursor:pointer; font-size:12px; font-family:'Inter',sans-serif; display:flex; align-items:center; gap:4px; transition:color 0.2s; padding:4px 8px; border-radius:6px; }
  .refresh-btn:hover { color:var(--accent-dark); }
  @keyframes spin { to{transform:rotate(360deg)} }
  .spinning { animation:spin 0.6s linear; }
  #toast { position:fixed; bottom:24px; right:24px; background:var(--bg-sub); border:1px solid var(--accent); border-radius:10px; padding:12px 20px; font-size:13px; color:var(--accent); z-index:9999; transform:translateY(60px); opacity:0; transition:all 0.3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 4px 20px rgba(0,240,255,0.15); }
  #toast.show { transform:translateY(0); opacity:1; }
  @media(max-width:768px){ #app.show{grid-template-columns:1fr} nav{padding:0 16px} }
</style>
</head>
<body>

<nav>
  <div class="logo"><div class="logo-icon">✉</div>BRMail<span style="color:var(--accent)">.shop</span></div>
  <div class="nav-utility">
    <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">🌙</span><span id="theme-text">Dark Mode</span></button>
    <div class="status-dot"><div class="dot"></div>Sistema Ativo</div>
  </div>
</nav>

<div id="hero-section">
  <div class="badge">✦ E-mail temporário — brmail.shop</div>
  <h1>Caixa de entrada<br><span>inteligente</span></h1>
  <p class="subtitle">Acesse seus e-mails temporários em <strong>brmail.shop</strong> com segurança e rapidez.</p>
  <div id="setup-card">
    <div class="card-label">// Acesso à caixa</div>
    <input type="email" id="email" placeholder="seualias@brmail.shop" />
    <input type="password" id="senha" placeholder="Senha de acesso" />
    <button class="btn" id="login-btn" onclick="fazerLogin()">Entrar na caixa de entrada →</button>
    <p id="msg-erro"></p>
  </div>
</div>

<div id="app">
  <div class="top-bar-clean">
    <div class="email-badge" onclick="copyEmail()" title="Clique para copiar">
      <span id="active-alias-text"></span><span style="opacity:0.5;font-size:12px">⎘</span>
    </div>
    <button class="btn btn-danger btn-sm" onclick="resetApp()">✕ Sair</button>
  </div>
  <div class="inbox-panel">
    <div class="panel-header">
      <div class="panel-title">📬 E-mails Recebidos <span class="count-badge" id="mail-count">0</span></div>
      <button class="refresh-btn" onclick="fetchRealEmails(true)"><span id="refresh-icon">⟳</span> atualizar</button>
    </div>
    <div class="mail-list" id="mail-list">
      <div class="empty-inbox"><div style="font-size:48px;opacity:0.3">📭</div><div>Nenhum e-mail ainda</div><div style="font-size:11px;opacity:0.5;margin-top:4px">Atualizando a cada 5s</div></div>
    </div>
  </div>
  <div class="email-view" id="email-view">
    <div class="no-email-selected"><div style="font-size:48px;opacity:0.2">✉</div><div>Selecione um e-mail para ler</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
  const WORKER_URL = 'https://recebedor-brmail.klevi8129.workers.dev';
  let credenciais = {email:'',senha:''};
  let emailsState = [], selectedId = null, pollingTimer = null;

  applyTheme(localStorage.getItem('brmail_theme') || 'light');
  function toggleTheme() { applyTheme(document.body.classList.contains('dark-theme') ? 'light' : 'dark'); }
  function applyTheme(t) {
    document.body.classList.toggle('dark-theme', t==='dark');
    document.body.classList.toggle('light-theme', t!=='dark');
    document.getElementById('theme-icon').innerText = t==='dark' ? '☀️' : '🌙';
    document.getElementById('theme-text').innerText = t==='dark' ? 'Light Mode' : 'Dark Mode';
    localStorage.setItem('brmail_theme', t);
  }

  async function fazerLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value.trim();
    const erroMsg = document.getElementById('msg-erro');
    const btn = document.getElementById('login-btn');
    if (!email || !senha) { erroMsg.innerText='Preencha todos os campos.'; erroMsg.style.display='block'; return; }
    erroMsg.style.display='none'; btn.innerText='Verificando...'; btn.disabled=true;
    try {
      const res = await fetch(WORKER_URL+'/api/ler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,senha})});
      if (res.status===401) { erroMsg.innerText='E-mail ou senha incorretos!'; erroMsg.style.display='block'; btn.innerText='Entrar na caixa de entrada →'; btn.disabled=false; return; }
      credenciais = {email, senha};
      document.getElementById('hero-section').style.display='none';
      document.getElementById('app').classList.add('show');
      document.getElementById('active-alias-text').textContent=email;
      emailsState = await res.json();
      renderMailList();
      pollingTimer = setInterval(()=>fetchRealEmails(false), 5000);
    } catch(e) { erroMsg.innerText='Erro ao conectar com o servidor.'; erroMsg.style.display='block'; btn.innerText='Entrar na caixa de entrada →'; btn.disabled=false; }
  }

  async function fetchRealEmails(manual) {
    if (manual) document.getElementById('refresh-icon').classList.add('spinning');
    try {
      const res = await fetch(WORKER_URL+'/api/ler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(credenciais)});
      const novos = await res.json();
      if (novos.length > emailsState.length) showToast('📨 Novo e-mail recebido!');
      emailsState = novos; renderMailList();
    } catch(e) {}
    if (manual) setTimeout(()=>document.getElementById('refresh-icon').classList.remove('spinning'), 500);
  }

  function renderMailList() {
    const list = document.getElementById('mail-list');
    document.getElementById('mail-count').textContent = emailsState.length;
    if (emailsState.length===0) { list.innerHTML='<div class="empty-inbox"><div style="font-size:48px;opacity:0.3">📭</div><div>Nenhum e-mail ainda</div></div>'; return; }
    list.innerHTML='';
    emailsState.forEach(email => {
      const d = document.createElement('div');
      d.className = 'mail-item'+(selectedId===email.id?' active':'');
      const t = new Date(email.time);
      d.innerHTML = `<div class="mail-from">${esc(email.from)}</div><div class="mail-subject">${esc(email.subject||'Sem assunto')}</div><div class="mail-time">${t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>`;
      d.onclick = () => selectEmail(email.id);
      list.appendChild(d);
    });
  }

  function selectEmail(id) {
    selectedId = id; renderMailList();
    const email = emailsState.find(e=>e.id===id);
    if (!email) return;
    const view = document.getElementById('email-view');

    const codeSection = email.code ? `
      <div class="code-box">
        <div class="code-label">🔐 Código de verificação</div>
        <div class="code-number">${esc(email.code)}</div>
        <div class="copy-code-btn" onclick="copyCode('${esc(email.code)}')">📋 Copiar código</div>
      </div>` : '';

    const linksSection = (email.links && email.links.length > 0) ? `
      <div class="links-section">
        <div class="links-label">🔗 Links de verificação</div>
        ${email.links.map(l=>`<a href="${esc(l)}" target="_blank" class="verify-link"><span>🔗</span><span>${esc(l)}</span></a>`).join('')}
      </div>` : '';

    const bodySection = email.text ? `<hr class="divider"><div class="text-body">${esc(email.text.substring(0,1500))}</div>` : '';

    view.innerHTML = `
      <div class="email-view-header">
        <div class="email-subject-title">${esc(email.subject||'Sem assunto')}</div>
        <div class="email-meta">
          <span>✉ De: <strong style="color:var(--text-main)">${esc(email.from)}</strong></span>
          <span>→ Para: <strong style="color:var(--accent-dark)">${esc(email.to)}</strong></span>
          <span>🕐 ${new Date(email.time).toLocaleString('pt-BR')}</span>
        </div>
      </div>
      <div class="email-body">
        ${codeSection}${linksSection}${bodySection}
        ${!email.code && !(email.links?.length) && !email.text ? '<div style="color:var(--text-sub);font-size:13px;text-align:center;padding:40px">Conteúdo vazio.</div>' : ''}
      </div>`;
  }

  function copyEmail() { navigator.clipboard.writeText(credenciais.email).then(()=>showToast('✓ E-mail copiado!')); }
  function copyCode(code) { navigator.clipboard.writeText(code).then(()=>showToast('✓ Código copiado: '+code)); }
  function resetApp() { clearInterval(pollingTimer); location.reload(); }
  function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
  function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && document.getElementById('hero-section').style.display!=='none') fazerLogin(); });
</script>
</body>
</html>
